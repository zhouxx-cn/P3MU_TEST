################################################################################
# Hardware Config Driver
################################################################################

################################################################################
# gpio desc <pin,trig,dir,init>
# pin: gpio-no
# trig: 0 - low-level trig
#       1 - high-level trig
# dir:  0 - out
#       1 - in
# init: trig or not when init, only used when dir out
################################################################################
# Base Config
board = P3MU
sensor = GC20C3

# ALARM
################################################################################
# type:
#     0 - gpio
#     1 - htr33351
################################################################################
# Alarm Out
alarm_out_num = 0
alarm_out0_type = 0
alarm_gpio_out0 = -1,1,0,0
alarm_out1_type = 0
alarm_gpio_out1 = -1,1,0,0

# Alarm In
alarm_in_num = 0
alarm_in0_type = 0
alarm_gpio_in0 = -1,1,1,-1
alarm_in1_type = 0
alarm_gpio_in1 = -1,1,1,-1

# IRCut
################################################################################
# ircut_ctl_type:
#     0 - gpio
#     1 - he2866
#     2 - htr33351
################################################################################
ircut_ctl_type = 0
ircut_gpio_p = 1,1,0,0
ircut_gpio_n = 12,1,0,0
ircut_hold_ms = 150

ircut2_ctl_type = 0
ircut2_gpio_p = -1,1,0,0
ircut2_gpio_n = -1,1,0,0
ircut2_hold_ms = 150

# System Reset
reset_gpio = 49,0,1,-1

# Speak power
speak_gpio = 21,0,0,1

# SD Card power
sdcard_gpio = 28,0,0,1

# wifi power
wifi_gpio = 0,0,0,1

################################################################################
# keycall_type:
#	0 - gpio
#	1 - adc
################################################################################
# keycall
keycall_type = 0
keycall_adc_chn = -1
keycall_gpio = 13,1,1,-1
# keycall2
keycall2_type = 0
keycall2_adc_chn = -1
keycall2_gpio = 22,1,1,-1

################################################################################
# Light Hardware Config
################################################################################
################################################################################
# cds_type:
#     0 - gpio
#     1 - adc
#     2 - htr33351
################################################################################
################################################################################
# light_xx_ctltype:
#     0 - gpio
#     1 - pwm
#     2 - htr33351
################################################################################
# CDS
cds_type = 0
cds_adc_chn = -1
cds_gpio = -1,0,1,0
# CDS2
cds2_type = 0
cds2_adc_chn = -1
cds2_gpio = -1,0,1,0
# flash led
light_flash_ctltype = 0
light_flash_gpio = -1,1,0,0
light_ir_pwm = -1
# net led
light_net_ctltype = 0
light_net_gpio = -1,0,0,0
light_net_pwm = -1
# power led
light_power_ctltype = 0
light_power_gpio = -1,0,0,1
light_power_pwm = -1
# light ir
light_ir_ctltype = 1
light_ir_gpio = 60,1,0,0
light_ir_pwm = 7
# light ir2
light_ir2_ctltype = 0
light_ir2_gpio = -1,0,0,0
light_ir2_pwm = -1
# light white
light_wt_ctltype = 1
light_wt_gpio = 61,1,0,0
light_wt_pwm = 6
# light white2
light_wt2_ctltype = 0
light_wt2_gpio = -1,0,0,0
light_wt2_pwm = -1

################################################################################
# EXPWM Config
################################################################################
expwm_mask = 0x18000

################################################################################
# HE2866 Config
################################################################################
he2866_en_gpio = -1,1,0,0
he2866_scl_gpio = -1,1,0,0
he2866_sda_gpio = -1,1,0,0

################################################################################
# HTR33351 Config
################################################################################
htr33351_i2c_chn = -1

################################################################################
# MOTOR Config
################################################################################
################################################################################
# motor_ctltype:
#     0 - gpio
#     1 - he2866
#     2 - htr33351
################################################################################
motor_support = 1
motor_ctltype = 0
motor_h_wire1_gpio = 59,1,0,0
motor_h_wire2_gpio = 56,1,0,0
motor_h_wire3_gpio = 57,1,0,0
motor_h_wire4_gpio = 47,1,0,0
motor_v_wire1_gpio = 46,1,0,0
motor_v_wire2_gpio = 48,1,0,0
motor_v_wire3_gpio = 51,1,0,0
motor_v_wire4_gpio = 50,1,0,0

################################################################################
# SYS Config
################################################################################
# zram size(MB)
zram_en = 0
zram_size = 10
zram_swappiness = 200
